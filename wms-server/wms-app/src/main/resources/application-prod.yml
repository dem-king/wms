spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/wms?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

minio:
  endpoint: http://minio:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: wms

wms:
  ip-region:
    enabled: ${IP_REGION_ENABLED:true}
    xdb-path: ${IP2REGION_XDB_PATH:classpath:ip2region.xdb}
  storage:
    type: ${STORAGE_TYPE:minio}
    minio-endpoint: http://minio:9000
    minio-access-key: ${MINIO_ACCESS_KEY}
    minio-secret-key: ${MINIO_SECRET_KEY}
    minio-bucket-name: ${MINIO_BUCKET:wms}
    minio-public-domain: ${MINIO_PUBLIC_DOMAIN:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

aj:
  captcha:
    cache-type: redis
    water-mark: wms
    slip-offset: 5
    timestamp: 2
    font-size: 25
    intercept-urls: /captcha/get,/captcha/check,/captcha/verify
    intercept-login: false

encode:
  key: ${ENCODE_KEY}

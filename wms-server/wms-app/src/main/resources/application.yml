server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: wms-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

wms:
  amap:
    key: ${AMAP_KEY:}
    geocode-url: ${AMAP_GEOCODE_URL:https://restapi.amap.com/v3/geocode/regeo}
    weather-url: ${AMAP_WEATHER_URL:https://restapi.amap.com/v3/weather/weatherInfo}
  ip-region:
    enabled: ${IP_REGION_ENABLED:true}
    xdb-path: ${IP2REGION_XDB_PATH:classpath:ip2region.xdb}
  storage:
    type: ${STORAGE_TYPE:local}
    local-base-dir: ${STORAGE_LOCAL_DIR:storage}
    local-url-prefix: /api/storage

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  setting:
    language: zh_cn

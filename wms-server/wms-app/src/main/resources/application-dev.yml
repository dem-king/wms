spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:wqy123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

jwt:
  secret: ${JWT_SECRET:dev_jwt_secret}
  expiration: 86400000
  refresh-expiration: 604800000

wms:
  auth:
    jwt-secret: ${JWT_SECRET:dev_jwt_secret}
    access-token-expire: 7200
    refresh-token-expire: 604800
    token-renew-threshold: 1800
    login-fail-threshold: 5
    lock-duration: 1800
    ip-rate-limit-threshold: 10
    captcha-expire: 120
    rsa-key-expire: 86400
    captcha-enabled: true
  default-password: ${WMS_DEFAULT_PASSWORD:dev_default_password}
  ip-region:
    enabled: ${IP_REGION_ENABLED:true}
    xdb-path: ${IP2REGION_XDB_PATH:classpath:ip2region.xdb}
  storage:
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    minio-access-key: ${MINIO_ACCESS_KEY:dev_minio_access_key}
    minio-secret-key: ${MINIO_SECRET_KEY:dev_minio_secret_key}
    minio-bucket-name: ${MINIO_BUCKET:wms}
    minio-public-domain: ${MINIO_PUBLIC_DOMAIN:}

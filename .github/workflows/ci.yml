name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  backend:
    name: Java Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Harness Rule Check
        working-directory: ./
        run: |
          chmod +x scripts/check-rules.sh
          bash scripts/check-rules.sh

      - name: Harness Rule Check (Strict)
        working-directory: ./
        continue-on-error: true
        run: |
          chmod +x scripts/check-rules.sh
          bash scripts/check-rules.sh --strict

      - name: Maven Verify
        id: maven_verify
        run: mvn verify --batch-mode --no-transfer-progress -DskipTests=false 2>&1 | tee mvn-output.txt
        env:
          MYSQL_PASSWORD: ci_test
          REDIS_PASSWORD: ci_test
          MINIO_ACCESS_KEY: ci_test
          MINIO_SECRET_KEY: ci_test
          JWT_SECRET: ci_test_jwt_secret_key_2024

      - name: Check Test Count
        run: |
          TOTAL=$(grep -oP 'Tests run: \K\d+' mvn-output.txt | awk '{s+=$1} END {print s}')
          echo "Total tests: $TOTAL"
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "FAIL: No tests were executed. At least one test must pass."
            exit 1
          fi
          echo "Test count check passed ✓"

      - name: Upload Backend Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: wms-app-jar
          path: wms-server/wms-app/target/wms-app-*.jar

  frontend:
    name: Vue Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wms-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx vue-tsc --noEmit

      - name: Unit Test
        run: npx vitest run --reporter=verbose

      - name: Build
        run: npm run build

      - name: Upload Frontend Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: wms-web-dist
          path: wms-web/dist/
